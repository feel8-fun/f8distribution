# Artifact assembly needs no service checkout, compiler, frontend or app installation.
[workspace]
name = "f8distribution"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = "3.14.*"

[pypi-dependencies]
msgspec = ">=0.18.6"
pyyaml = ">=6.0.3,<7"
packaging = ">=25,<27"
httpx = ">=0.28,<1"

[pypi-dependencies.pytest]
version = ">=8.4,<9"

[tasks]
assemble = "python scripts/assemble.py"
verify = "python scripts/verify_dist.py"
test = "python -m pytest tests -q"
